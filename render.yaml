services:
  - type: web
    name: campusresolve
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn run:app --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusresolve-db
          property: connectionString
      - key: REGISTRATION_ENABLED
        value: "true"

databases:
  - name: campusresolve-db
    plan: free
    databaseName: campusresolve
    user: campusresolve