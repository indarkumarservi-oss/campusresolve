services:
  - type: web
    name: campusresolve
    env: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    preStartCommand: python init_db.py
    startCommand: gunicorn run:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusresolve-db
          property: connectionString

databases:
  - name: campusresolve-db
    databaseName: campusresolve
    user: campusresolve
    plan: free