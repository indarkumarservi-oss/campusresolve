services:
  - type: web
    name: campusresolve
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusresolve-db
          property: connectionString

databases:
  - name: campusresolve-db
    databaseName: campusresolve
    user: campusresolve
    plan: free