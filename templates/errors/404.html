{% extends 'base.html' %}

{% block title %}404 - Not Found - CampusResolve{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center py-5">
        <div class="display-1 text-warning"><i class="bi bi-search"></i></div>
        <h1 class="mt-3">404 - Not Found</h1>
        <p class="lead text-muted">The page you're looking for doesn't exist.</p>
        <p class="text-muted">It may have been moved or deleted.</p>
        <hr class="mx-auto" style="width: 50%;">
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Go Home</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary ms-2"><i class="bi bi-arrow-left me-1"></i>Go Back</a>
    </div>
</div>
{% endblock %}
